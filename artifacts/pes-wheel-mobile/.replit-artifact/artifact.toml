kind = "mobile"
previewPath = "/pes-wheel-mobile/"
title = "PES Wheel"
description = "تطبيق موبايل للاعبي PES Mobile يمنحهم لفة كوينز يومية مع شاشة ترحيب متحركة، رصيد محفوظ، سجل جوائز، ومهام يومية."
version = "1.0.0"
id = "artifacts/pes-wheel-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/pes-wheel-mobile/" ]
localPort = 18192

[services.development]
run = "pnpm --filter @workspace/pes-wheel-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pes-wheel-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pes-wheel-mobile", "run", "serve" ]

[services.env]
PORT = "18192"
BASE_PATH = "/pes-wheel-mobile/"
